# Licensing of the repository (https://reuse.software). License texts: LICENSES/.
# Rasklad's own code and documentation are MIT. Third-party files keep their own
# terms (overrides below); the notices are in data/notices/ and THIRD_PARTY.md.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 TebTengri and Rasklad contributors"
SPDX-License-Identifier = "MIT"

# Patches to Fcitx 5 (lab only, not in the product package) modify LGPL code and
# stay LGPL-2.1-or-later; see patches/fcitx5/README.md.
[[annotations]]
path = "patches/fcitx5/*.patch"
precedence = "override"
SPDX-FileCopyrightText = ["Fcitx 5 authors", "2026 TebTengri and Rasklad contributors"]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Upstream Wayland protocol descriptions; the full terms are inside each XML.
[[annotations]]
path = "vendor/wayland/hyprland-toplevel-mapping-v1.xml"
precedence = "override"
SPDX-FileCopyrightText = "2025 WhySoBad"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "vendor/wayland/wlr-foreign-toplevel-management-unstable-v1.xml"
precedence = "override"
SPDX-FileCopyrightText = "2018 Ilia Bozhinov"
SPDX-License-Identifier = "HPND-sell-variant"

[[annotations]]
path = ["tests/input_lab/protocol/input-method-unstable-v2.xml", "tests/wayland_ime/protocol/virtual-keyboard-unstable-v1.xml"]
precedence = "override"
SPDX-FileCopyrightText = "Wayland protocol authors (see the copyright block in each file)"
SPDX-License-Identifier = "MIT"

# Third-party license and notice texts, kept byte for byte. Each is labelled with
# the license it states; the dictionary and MySpell notices are their own
# LicenseRef texts (copies in LICENSES/).
[[annotations]]
path = "data/notices/en_US.README.txt"
precedence = "override"
SPDX-FileCopyrightText = "Kevin Atkinson and the other authors named in the file"
SPDX-License-Identifier = "LicenseRef-hunspell-en-US"

[[annotations]]
path = "data/notices/ru_RU.README.txt"
precedence = "override"
SPDX-FileCopyrightText = "1997-2008 Alexander I. Lebedev"
SPDX-License-Identifier = "LicenseRef-hunspell-ru-RU"

[[annotations]]
path = "data/notices/Hunspell-license.myspell.txt"
precedence = "override"
SPDX-FileCopyrightText = "the MySpell authors named in the file"
SPDX-License-Identifier = "LicenseRef-myspell"

[[annotations]]
path = "data/notices/Hunspell-COPYING.MPL.txt"
precedence = "override"
SPDX-FileCopyrightText = "Netscape Communications Corporation"
SPDX-License-Identifier = "MPL-1.1"

[[annotations]]
path = "data/notices/CC0-1.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "Creative Commons"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "data/notices/Fcitx5-LGPL-2.1-or-later.txt"
precedence = "override"
SPDX-FileCopyrightText = "Free Software Foundation, Inc."
SPDX-License-Identifier = "LicenseRef-fsf-verbatim"

[[annotations]]
path = ["data/notices/OrderedMap-MIT.txt", "data/notices/ProseMirror-MIT.txt", "data/notices/RopeSequence-MIT.txt", "data/notices/RustBook-*-LICENSE-MIT.txt"]
precedence = "override"
SPDX-FileCopyrightText = "the authors named in each file"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "data/notices/RustBook-*-LICENSE-APACHE.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "data/notices/RustBook-*-COPYRIGHT.txt"
precedence = "override"
SPDX-FileCopyrightText = "The Rust Project Developers"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "data/notices/UKACD-readme.txt"
precedence = "override"
SPDX-FileCopyrightText = "1993-2000 J Ross Beresford"
SPDX-License-Identifier = "LicenseRef-ukacd"
