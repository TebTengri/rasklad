# Licensing of files that carry no SPDX header (https://reuse.software).
# Rasklad's own code and documentation are MIT (LICENSE). Third-party files keep
# their own terms; the notices are in data/notices/ and THIRD_PARTY.md.
version = 1

[[annotations]]
path = ["packaging/arch/rasklad-settings.desktop", "packaging/arch/rasklad-settings.svg", "packaging/omarchy/**", "settings/i18n/**", "docs/**", "*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 TebTengri and Rasklad contributors"
SPDX-License-Identifier = "MIT"

# Patches to Fcitx 5 (lab only, not in the product package) modify LGPL code and
# stay LGPL-2.1-or-later; see patches/fcitx5/README.md.
[[annotations]]
path = "patches/fcitx5/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "Fcitx 5 authors; changes 2026 Rasklad contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Upstream Wayland protocol descriptions used only by development fixtures; the
# full terms are inside each XML (vendor/wayland/README.md).
[[annotations]]
path = "vendor/wayland/hyprland-toplevel-mapping-v1.xml"
precedence = "override"
SPDX-FileCopyrightText = "2025 WhySoBad"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "vendor/wayland/wlr-foreign-toplevel-management-unstable-v1.xml"
precedence = "override"
SPDX-FileCopyrightText = "2018 Ilia Bozhinov"
SPDX-License-Identifier = "HPND-sell-variant"

# Dictionary notices and other third-party license texts, kept byte for byte.
[[annotations]]
path = "data/notices/*.txt"
precedence = "override"
SPDX-FileCopyrightText = "see each file"
SPDX-License-Identifier = "LicenseRef-upstream-notice"
