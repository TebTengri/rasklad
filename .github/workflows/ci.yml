# SYS-258: automatic checks on GitHub. Runs tools/ci.sh in an Arch container as an
# unprivileged user: the product build as PKGBUILD does it, the unit and packaging
# tests and the script linters (the rasklad-setup sandbox needs bubblewrap and
# Omarchy, so it stays local with the stand). No secrets, no profile,
# no real input, nothing written to the repository; the Sway/Fcitx stand stays local.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-declarative fcitx5 \
            hunspell alsa-lib wayland libxkbcommon python python-gobject shellcheck lua
          useradd -m ci
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checks
        # The checkout (and its .git, which the action's root cleanup uses) stays
        # root's; the unprivileged user gets a copy of the tracked files only, in a
        # fresh repository of its own.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install -d -o ci -g ci /home/ci/src
          git -C "$GITHUB_WORKSPACE" archive HEAD | runuser -u ci -- tar -x -C /home/ci/src
          runuser -u ci -- bash -c 'cd /home/ci/src && git init -q && git add -A &&
            git -c user.name=ci -c user.email=ci@localhost commit -q -m ci'
          runuser -u ci -- env -C /home/ci/src CI=true QT_QPA_PLATFORM=offscreen bash tools/ci.sh
